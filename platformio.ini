[platformio]
default_envs = esp32-s3

[env]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
; Patches a vendored NeoPixelBus header that fails to compile on ESP-IDF 5.5+
; (upstream fix not released yet, see comment in the script). Safe no-op elsewhere.
extra_scripts = pre:patch_neopixelbus.py

lib_deps =
    makuna/NeoPixelBus @ ^2.8.0
    bblanchon/ArduinoJson @ ^7.0.0
    esphome/esp-hub75 @ ^0.3.0

build_flags =
    -I include
    -D HYPERLED_SLAVE_VERSION=\"0.1.009\"
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; The board variant defines RGB_BUILTIN for the onboard WS2812, which makes the Arduino
    ; core link in its next-gen RMT driver. NeoPixelBus still uses the legacy RMT driver, and
    ; having both aborts at boot ("CONFLICT! driver_ng is not allowed..."), bootlooping the
    ; device. This is the core's own documented opt-out; HyperLED never drives GPIO21 anyway.
    -D ESP32_ARDUINO_NO_RGB_BUILTIN
    -fno-exceptions
    -fno-rtti
    -D HUB75_BIT_DEPTH=6

; Waveshare ESP32-S3-Zero: ESP32-S3FH4R2, embedded 4MB flash + 2MB PSRAM, both Quad SPI.
; The "R2" variant is quad-SPI PSRAM - configuring it as octal (opi) makes the chip crash
; on boot, so memory_type must stay qio_qspi here.
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM


